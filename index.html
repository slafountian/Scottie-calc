<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Construction Calculator for inches and fractions">
    <meta name="theme-color" content="#2a2a2a">
    <title>Scottie Calculator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="header-title-section">
                <h1><span class="header-icon">📐</span> Scottie <span class="accent">Calculator</span></h1>
                <p class="tagline">Built for Builders</p>
            </div>
        </header>
        <div class="calculator" id="constructionCalculator">
            <div class="history-section">
                <label class="history-label" for="historySelect">Past Calculations</label>
                <div class="history-controls">
                    <select id="historySelect" class="history-select">
                        <option value="">Select from history...</option>
                    </select>
                    <button type="button" class="action-btn clear-history-btn" id="clearHistoryBtn" onclick="if(window.clearHistory){window.clearHistory();}">Clear History</button>
                    <button type="button" class="mode-toggle-btn" id="modeToggleBtn" title="Switch to Regular Calculator">
                        <span class="mode-icon">🔢</span>
                        <span class="mode-text">Regular</span>
                    </button>
                </div>
            </div>

            <div class="display">
                <div class="total-row">
                    <div class="total-item">
                        <div class="total-label">Feet / Inches</div>
                        <div class="result" id="runningTotal">0"</div>
                    </div>
                    <div class="caption-section">
                        <p class="caption-line">RIDE FAST</p>
                        <p class="caption-line">OR</p>
                        <p class="caption-line">DIE SLOW</p>
                    </div>
                    <div class="total-item">
                        <div class="total-label">Inches Only</div>
                        <div class="result" id="runningTotalInches">0"</div>
                    </div>
                </div>
            </div>

            <div id="measurementsContainer" class="measurements-container">
                <!-- Measurements will be added here dynamically -->
            </div>

            <div class="action-buttons">
                <button type="button" class="action-btn add-measurement-btn" id="addMeasurementBtn">+ Add Measurement</button>
                <button type="button" class="action-btn clear-btn" id="clearBtn" onclick="if(window.clearAll){window.clearAll();}">Clear All</button>
            </div>

            <!-- Custom Keypad - Static on screen -->
            <div class="keypad-container-static" id="keypadContainer">
                <div class="keypad-header-static">
                    <span class="keypad-label-static" id="keypadLabel">Tap a field to enter</span>
                </div>
                <div class="keypad-grid-static" id="keypadGrid">
                    <!-- Numbers will be generated by JavaScript -->
                </div>
            </div>

            <div class="quick-fractions">
                <div class="fraction-buttons">
                    <button class="fraction-btn" data-num="1" data-den="16">1/16</button>
                    <button class="fraction-btn" data-num="1" data-den="8">1/8</button>
                    <button class="fraction-btn" data-num="1" data-den="4">1/4</button>
                    <button class="fraction-btn" data-num="3" data-den="8">3/8</button>
                    <button class="fraction-btn" data-num="1" data-den="2">1/2</button>
                    <button class="fraction-btn" data-num="5" data-den="8">5/8</button>
                    <button class="fraction-btn" data-num="3" data-den="4">3/4</button>
                    <button class="fraction-btn" data-num="7" data-den="8">7/8</button>
                </div>
            </div>

            <div class="result-display" id="resultDisplay"></div>
        </div>

        <!-- Regular Calculator Mode -->
        <div class="calculator regular-calc" id="regularCalculator" style="display: none;">
            <div class="calc-header-controls">
                <button type="button" class="mode-toggle-btn calc-mode-btn" id="regularCalcModeBtn" title="Switch to Construction Calculator">
                    <span class="mode-icon">📏</span>
                    <span class="mode-text">Construction</span>
                </button>
            </div>
            <div class="calc-display">
                <div class="calc-screen" id="calcScreen">0</div>
            </div>
            
            <div class="calc-buttons">
                <button class="calc-btn calc-btn-clear" data-action="clear">C</button>
                <button class="calc-btn calc-btn-clear" data-action="clearAll">AC</button>
                <button class="calc-btn calc-btn-operator" data-action="backspace">⌫</button>
                <button class="calc-btn calc-btn-operator" data-action="divide">÷</button>
                
                <button class="calc-btn calc-btn-number" data-number="7">7</button>
                <button class="calc-btn calc-btn-number" data-number="8">8</button>
                <button class="calc-btn calc-btn-number" data-number="9">9</button>
                <button class="calc-btn calc-btn-operator" data-action="multiply">×</button>
                
                <button class="calc-btn calc-btn-number" data-number="4">4</button>
                <button class="calc-btn calc-btn-number" data-number="5">5</button>
                <button class="calc-btn calc-btn-number" data-number="6">6</button>
                <button class="calc-btn calc-btn-operator" data-action="subtract">−</button>
                
                <button class="calc-btn calc-btn-number" data-number="1">1</button>
                <button class="calc-btn calc-btn-number" data-number="2">2</button>
                <button class="calc-btn calc-btn-number" data-number="3">3</button>
                <button class="calc-btn calc-btn-operator" data-action="add">+</button>
                
                <button class="calc-btn calc-btn-number calc-btn-zero" data-number="0">0</button>
                <button class="calc-btn calc-btn-number" data-action="decimal">.</button>
                <button class="calc-btn calc-btn-equals" data-action="equals">=</button>
            </div>
            
            <div class="calc-caption-section">
                <p class="calc-caption-line">LIVE TO RIDE</p>
                <p class="calc-caption-line">RIDE TO LIVE</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
